name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'palettes.toml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'palettes.toml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check lib tests scripts
      - name: Unit tests
        env:
          PYTHONPATH: lib
        run: python -m unittest discover -s tests

  validate-pyscript-filesystem-toml:
    uses: PyDevices/.github/.github/workflows/reusable-validate-pyscript-filesystem-toml.yml@publishing-v3
    with:
      config-path: palettes.toml
      source-mappings: lib=/lib
